name: Deploy Preview

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (empty = branch you run this workflow from)'
        required: false
        type: string
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches:
      - beta
      - 'preview/**'

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve preview branch
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.meta.outputs.branch }}
      ref: ${{ steps.meta.outputs.ref }}
      should_deploy: ${{ steps.meta.outputs.should_deploy }}
    steps:
      - id: meta
        run: |
          BRANCH="${{ github.event.pull_request.head.ref || github.event.inputs.branch || github.ref_name }}"
          REF="${{ github.event.pull_request.head.sha || github.event.inputs.branch || github.ref }}"

          if [ "$BRANCH" = "main" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Preview deploys bruger ikke main — merge til main deployer production automatisk."
            exit 0
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy-preview:
    name: Deploy preview to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.should_deploy == 'true'
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=groen-trepart-tracker --branch=${{ needs.resolve.outputs.branch }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Preview URL summary
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          URL="${ALIAS_URL:-$DEPLOY_URL}"
          echo "### Preview deployet" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ needs.resolve.outputs.branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          PREVIEW_BRANCH: ${{ needs.resolve.outputs.branch }}
        with:
          script: |
            const url = process.env.ALIAS_URL || process.env.DEPLOY_URL;
            const branch = process.env.PREVIEW_BRANCH;
            const marker = '<!-- trepart-preview-deploy -->';
            const body = [
              marker,
              '## Preview-deploy klar',
              '',
              `**Branch:** \`${branch}\``,
              `**URL:** ${url}`,
              '',
              'Opdateres automatisk ved nye commits til denne PR.',
              '',
              'Production deployer kun fra `main`.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
